[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-doc-mcp"
version = "0.1.0"
description = "MCP server for answering questions from the Apache Infrastructure documentation (infra.apache.org)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # Upper bound is load-bearing: MCP Python SDK v2 ships on PyPI as "mcp" and
  # REMOVED (not deprecated) mcp.server.fastmcp, which tools.py imports.
  # Staying on the v1 line until the v2 migration is done deliberately.
  "mcp>=1.20,<2",
  "httpx>=0.27.0",
]
keywords = ["mcp", "apache", "infrastructure", "documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/justinmclean/InfraDocMCP"
Repository = "https://github.com/justinmclean/InfraDocMCP"
Issues = "https://github.com/justinmclean/InfraDocMCP/issues"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "mypy>=1.0",
  "pytest>=8.0",
  "ruff>=0.8.0",
]

[project.scripts]
infra-doc-mcp = "infra_doc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults, so lint
# results do not depend on the installed ruff version.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["infra_doc_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false
